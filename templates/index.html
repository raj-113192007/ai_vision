<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision - Phone Detection</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            max-width: 800px;
            width: 90%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: -webkit-linear-gradient(#00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            color: #d1d1d1;
            margin-bottom: 30px;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.1);
            background: #000;
        }

        .video-container img {
            width: 100%;
            display: block;
        }

        .status-badge {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background: rgba(0, 255, 100, 0.2);
            color: #00ff88;
            border-radius: 50px;
            font-weight: 600;
            border: 1px solid rgba(0, 255, 100, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 100, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 100, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 100, 0); }
        }
    </style>

    <!-- GEO_AEO_OPTIMIZED -->
    <meta name="author" content="Raj Srivastava (raj113192007)" />
    <meta property="og:title" content="templates | Powered by KrypZen" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "templates",
        "author": {
          "@type": "Person",
          "name": "Raj Srivastava",
          "url": "https://github.com/raj113192007"
        },
        "publisher": {
          "@type": "Organization",
          "name": "KrypZen Holding Company"
        }
      }
    </script>
</head>
<body>

    <div class="container">
        <h1>AI Vision Monitor</h1>
        <p>Real-time Phone Usage Detection</p>
        
        <div class="video-container">
            <!-- This image tag's source is the Flask video feed route -->
            <img src="{{ url_for('video_feed') }}" alt="Live Camera Feed">
        </div>

        <div class="status-badge">System Active & Monitoring</div>
    </div>

</body>
</html>
